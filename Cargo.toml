[package]
name = "voyage"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.79"
chrono = "0.4.38"
clap = { version = "4.5.16", features = ["derive"] }
env_logger = "0.11.5"
ip_network = "0.4.1"
itertools = "0.12.0"
log = "0.4.21"
netdev = "0.30.0"
once_cell = "1.19.0"
rand = { version = "0.8.5", features = ["small_rng"] }
pantrace = { git = "https://github.com/teo-lohrer-su/pantrace", branch = "main" }
pnet = "0.34.0"
rand_chacha = "0.3.1"
serde = "1.0.195"
serde_json = "1.0.138"
stirling_numbers = "0.1.7"
caracat = "1.4.2"
